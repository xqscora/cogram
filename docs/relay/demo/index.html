<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cogram Relay - Recorded Walkthrough</title>
  <style>
    :root{font:14px system-ui,sans-serif;color:#243b32;background:#f8faf9;letter-spacing:0;color-scheme:light}
    *{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #d4ded9;padding:20px 24px;display:flex;gap:18px;align-items:center;background:#fff;flex-wrap:wrap}header a{font-size:20px;font-weight:700;text-decoration:none}header span{color:#6e7d74;font-size:13px}a{color:#176758}main{width:min(1200px,100%);margin:24px auto;padding:0 16px}video{display:block;width:100%;aspect-ratio:16/9;background:#183b32}nav{display:flex;gap:20px;flex-wrap:wrap;padding:18px 0;line-height:1.8}a:focus-visible{outline:2px solid #176758;outline-offset:4px}@media(max-width:600px){header{padding:16px;gap:8px 16px}main{margin:16px auto}nav{gap:12px 20px}}
  </style>
</head>
<body>
  <header><a href="../">Cogram Relay</a><span>Recorded walkthrough</span></header>
  <main>
    <video controls playsinline preload="metadata" poster="poster.jpg" aria-label="Cogram Relay narrated browser walkthrough">
      <source src="walkthrough.mp4" type="video/mp4">
    </video>
    <nav aria-label="Project links">
      <a href="../">Open workspace</a>
      <a href="walkthrough.mp4" download>Download video</a>
      <a href="captions.vtt">English captions</a>
      <a href="../README.md">Source and disclosures</a>
    </nav>
  </main>
</body>
</html>
